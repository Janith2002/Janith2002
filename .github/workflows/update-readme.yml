name: Auto Update Profile README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run update script
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python .github/scripts/update_readme.py

      - name: Commit if changed
        run: |
          git config user.name "Janith2002"
          git config user.email "192848544+Janith2002@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "ci: auto-update profile README [skip ci]"
          git push
